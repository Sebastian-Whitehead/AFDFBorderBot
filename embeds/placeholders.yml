# Per embed file: the {placeholders} it may use.
# "member" = the standard member ones ({user}, {username}, {userid}, {usertag}); a list = values the sending command supplies.
# {channel:<key>} and {role:<key>} (see ids.yml) are always allowed. tests/test_embeds.py checks this.
member_join.json: member
member_leave.json: member
newcitizen-main.json: member
enlist-welcome.json: member
loa.json: [username, period, reason, avatar_url]
attendance_absent_warning.json: [absent_list]
delete_service_event_warning.json: [event_id, event_type, date]
delete_session_warning.json: [session_name, session_id, attendance_count]
force_merge_warning.json: [steam_id, member, steam_side, discord_side, survivor]
merge_service_records_warning.json: [steam_id, member, steam_side, discord_side, new_rank, new_status, old_rank, old_status]
end_session_warning.json: []
session_list.json: [timeline, table, page, pages, total]
